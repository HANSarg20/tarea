<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Texto Avanzado</title>
    <!-- Incluyendo Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl mx-auto bg-white shadow-2xl rounded-2xl p-6 md:p-10">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Reproductor de Texto Avanzado</h1>
            <p class="text-gray-500 mt-2">Escribe tu texto, elige una voz en español y escúchalo en voz alta.</p>
        </div>

        <!-- Área de texto -->
        <div class="mb-6">
            <label for="text-input" class="text-lg font-semibold mb-2 text-gray-700 block">Texto a reproducir</label>
            <textarea id="text-input" rows="8" class="w-full p-4 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200" placeholder="Escribe aquí lo que deseas escuchar..."></textarea>
        </div>

        <!-- Filtro de Género -->
        <div class="mb-6">
            <label class="text-lg font-semibold mb-2 text-gray-700 block">Filtrar voz por género</label>
            <div class="flex items-center space-x-4" id="gender-filter">
                <label class="flex items-center">
                    <input type="radio" name="gender" value="all" class="form-radio h-4 w-4 text-indigo-600" checked>
                    <span class="ml-2 text-gray-700">Todas</span>
                </label>
                <label class="flex items-center">
                    <input type="radio" name="gender" value="female" class="form-radio h-4 w-4 text-indigo-600">
                    <span class="ml-2 text-gray-700">Femenina</span>
                </label>
                <label class="flex items-center">
                    <input type="radio" name="gender" value="male" class="form-radio h-4 w-4 text-indigo-600">
                    <span class="ml-2 text-gray-700">Masculina</span>
                </label>
            </div>
        </div>

        <!-- Opciones de voz y velocidad -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
            <div>
                <label for="voice-select" class="text-lg font-semibold mb-2 text-gray-700 block">Elige una voz</label>
                <select id="voice-select" class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200">
                    <option>Cargando voces...</option>
                </select>
            </div>
            <div>
                <label for="rate-control" class="text-lg font-semibold mb-2 text-gray-700 block">Velocidad (<span id="rate-value">1.0</span>x)</label>
                <input id="rate-control" type="range" min="0.5" max="2" value="1" step="0.1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>

        <!-- Botones de acción -->
        <div class="text-center">
             <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button id="play-btn" class="w-full sm:w-auto bg-indigo-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-transform transform hover:scale-105 flex items-center justify-center gap-3">
                    <svg id="play-btn-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <span id="play-btn-text">Reproducir</span>
                </button>
                 <button id="share-btn" disabled class="w-full sm:w-auto bg-gray-400 text-white font-bold py-3 px-8 rounded-lg cursor-not-allowed flex items-center justify-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    <span>Compartir</span>
                </button>
            </div>
            <p id="download-info" class="text-xs text-gray-500 mt-3">La descarga y compartición de audio no están disponibles en esta plataforma por motivos de seguridad del navegador.</p>
            <div id="status-container" class="mt-4 text-center min-h-[2rem]"></div>
        </div>
        
        <!-- Mensaje de error -->
        <div id="error-message" class="mt-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg hidden"></div>

    </div>

    <script>
        // --- DOM Element Selection ---
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const playBtn = document.getElementById('play-btn');
        const playBtnIcon = document.getElementById('play-btn-icon');
        const playBtnText = document.getElementById('play-btn-text');
        const statusContainer = document.getElementById('status-container');
        const errorMessageDiv = document.getElementById('error-message');
        const rateControl = document.getElementById('rate-control');
        const rateValue = document.getElementById('rate-value');
        const genderFilter = document.getElementById('gender-filter');

        const synth = window.speechSynthesis;
        let voices = [];
        let utteranceQueue = [];
        const speechState = { IDLE: 'idle', PLAYING: 'playing', PAUSED: 'paused' };
        let currentSpeechState = speechState.IDLE;

        // --- UI and State Management ---
        function displayError(message) {
            errorMessageDiv.textContent = message;
            errorMessageDiv.classList.remove('hidden');
        }

        function clearError() {
            errorMessageDiv.classList.add('hidden');
            errorMessageDiv.textContent = '';
        }

        function updatePlayButtonUI(state) {
            currentSpeechState = state;
            switch (state) {
                case speechState.PLAYING:
                    playBtnText.textContent = 'Pausar';
                    playBtnIcon.innerHTML = `<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>`; // Pause icon
                    playBtn.classList.replace('bg-indigo-600', 'bg-orange-500');
                    playBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-orange-600');
                    break;
                case speechState.PAUSED:
                    playBtnText.textContent = 'Reanudar';
                    playBtnIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`; // Play icon
                    playBtn.classList.replace('bg-orange-500', 'bg-indigo-600');
                    playBtn.classList.replace('hover:bg-orange-600', 'hover:bg-indigo-700');
                    break;
                case speechState.IDLE:
                default:
                    playBtnText.textContent = 'Reproducir';
                    playBtnIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`; // Play icon
                    playBtn.classList.remove('bg-orange-500', 'hover:bg-orange-600');
                    playBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                    break;
            }
        }

        // --- Core Functions ---

        function populateVoiceList(genderFilterValue = 'all') {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            if (voices.length === 0) {
                setTimeout(() => populateVoiceList(genderFilterValue), 200);
                return;
            }

            const femaleKeywords = ['female', 'woman', 'girl', 'mujer', 'femenina', 'femenino', 'sabina', 'helena', 'laura', 'paulina', 'zira', 'susan', 'catherine', 'eva', 'lucia', 'elena', 'monica', 'carmen'];
            const maleKeywords = ['male', 'man', 'boy', 'hombre', 'masculina', 'masculino', 'jorge', 'pablo', 'david', 'ricardo', 'hector', 'raul', 'diego', 'carlos'];

            const createOption = (voice) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-name', voice.name);
                return option;
            };

            // 1. Get all Spanish voices first.
            let spanishVoices = voices.filter(voice => voice.lang.startsWith('es'));

            // 2. Apply gender filter ONLY to the Spanish voices.
            if (genderFilterValue !== 'all') {
                const keywords = genderFilterValue === 'female' ? femaleKeywords : maleKeywords;
                spanishVoices = spanishVoices.filter(voice => {
                    const name = voice.name.toLowerCase();
                    return keywords.some(keyword => name.includes(keyword));
                });
            }

            // 3. Populate the list.
            if (spanishVoices.length === 0) {
                 voiceSelect.innerHTML = `<option>No hay voces en español para este filtro</option>`;
                 return;
            }

            spanishVoices.forEach(voice => voiceSelect.appendChild(createOption(voice)));
        }

        function speakNextChunk() {
            if (utteranceQueue.length > 0 && currentSpeechState === speechState.PLAYING) {
                const utterance = utteranceQueue.shift();
                utterance.onend = speakNextChunk;
                utterance.onerror = (event) => {
                    console.error('SpeechSynthesisUtterance.onerror', event);
                    updatePlayButtonUI(speechState.IDLE);
                };
                synth.speak(utterance);
            } else {
                updatePlayButtonUI(speechState.IDLE);
            }
        }

        function handlePlayback() {
            clearError();
            if (currentSpeechState === speechState.PLAYING) {
                synth.pause();
                updatePlayButtonUI(speechState.PAUSED);
            } else if (currentSpeechState === speechState.PAUSED) {
                synth.resume();
                updatePlayButtonUI(speechState.PLAYING);
            } else { // IDLE
                const text = textInput.value.trim();
                const selectedVoiceName = voiceSelect.selectedOptions[0]?.getAttribute('data-name');

                if (!text) {
                    displayError("Por favor, introduce algo de texto.");
                    return;
                }
                if (!selectedVoiceName) {
                    displayError("No se ha podido seleccionar una voz. Por favor, recarga la página o cambia el filtro.");
                    return;
                }

                synth.cancel(); 
                
                const chunks = text.match(/[^.!?]+[.!?]*\s*|[^.!?]+$/g) || [];
                utteranceQueue = chunks.map(chunk => {
                    const utterance = new SpeechSynthesisUtterance(chunk.trim());
                    utterance.voice = voices.find(v => v.name === selectedVoiceName);
                    utterance.lang = utterance.voice?.lang || 'es-ES';
                    utterance.rate = parseFloat(rateControl.value);
                    return utterance;
                }).filter(u => u.text.length > 0);

                if (utteranceQueue.length > 0) {
                    updatePlayButtonUI(speechState.PLAYING);
                    speakNextChunk();
                }
            }
        }

        // --- Event Listeners ---
        
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = () => populateVoiceList();
        }
        populateVoiceList();

        playBtn.addEventListener('click', handlePlayback);

        rateControl.addEventListener('input', () => {
            rateValue.textContent = parseFloat(rateControl.value).toFixed(1);
            if (currentSpeechState !== speechState.IDLE) {
                synth.cancel();
                updatePlayButtonUI(speechState.IDLE);
            }
        });

        genderFilter.addEventListener('change', (e) => {
            populateVoiceList(e.target.value);
            if (currentSpeechState !== speechState.IDLE) {
                synth.cancel();
                updatePlayButtonUI(speechState.IDLE);
            }
        });

        setInterval(() => {
            if (currentSpeechState !== speechState.IDLE && !synth.speaking && !synth.paused) {
                console.warn("Speech synthesis hung. Resetting UI.");
                updatePlayButtonUI(speechState.IDLE);
            }
        }, 1000);

    </script>
</body>
</html>
